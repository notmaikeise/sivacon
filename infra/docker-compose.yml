services:
  postgres:
    image: postgres:16-alpine
    container_name: sivacon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sivacon
      POSTGRES_USER: sivacon
      POSTGRES_PASSWORD: sivacon_dev
    ports:
      - "5432:5432"
    volumes:
      - sivacon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivacon -d sivacon"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sivacon-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev
    ports:
      - "5050:80"
    volumes:
      - sivacon-pgadmin-data:/var/lib/pgadmin

volumes:
  sivacon-postgres-data:
  sivacon-pgadmin-data:
