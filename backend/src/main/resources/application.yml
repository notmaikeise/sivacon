spring:
  application:
    name: sivacon-backend
  datasource:
    url: ${SIVACON_DB_URL:jdbc:postgresql://localhost:5432/sivacon}
    username: ${SIVACON_DB_USERNAME:sivacon}
    password: ${SIVACON_DB_PASSWORD:sivacon_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true

server:
  port: ${SIVACON_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
